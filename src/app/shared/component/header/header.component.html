<div class="wrap-header">
    <nav>
        <ul>
            <li>
                <a (click)="navTo()" [routerLink]="['/about']" routerLinkActive="nav-active">
                    <i class="pi pi-user" ></i>
                    Sobre Mi
                </a>
            </li>
            <li>
                <a (click)="navTo()" [routerLink]="['/studies']" routerLinkActive="nav-active">
                    <i class="pi pi-graduation-cap" ></i>

                </a>
            </li>
            <li>
                <a (click)="navTo()" [routerLink]="['/projects']" routerLinkActive="nav-active">
                    <i class="pi pi-briefcase" ></i>

                </a>
            </li>
            <li>
                <a (click)="navTo()" [routerLink]="['/skills']" routerLinkActive="nav-active">

                </a>
            </li>
            <li>

                </a>
            </li>
            
        </ul>

    <div class="theme-switcher">
        <div class="icon-theme">
            <i class="pi pi-moon" style="font-size: 19px;"></i>
        </div>

            <input id="theme-swith" type="checkbox" [checked]="isLightTheme" (change)="toggleTheme()">

        </label>
        <div class="icon-theme">
            <i class="pi pi-sun" style="font-size: 20px;"></i>
        </div>
    </div>
